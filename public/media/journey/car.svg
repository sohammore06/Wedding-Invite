  <circle cx="36" cy="50" r="5.5" fill="#5C6E51"/>
  <circle cx="36" cy="50" r="2.2" fill="#C9A24B"/>
  <circle cx="92" cy="50" r="9" fill="#3D171F"/>
  <circle cx="92" cy="50" r="5.5" fill="#5C6E51"/>
  <circle cx="92" cy="50" r="2.2" fill="#C9A24B"/>

  <!-- Wheel spokes hint -->
  <path d="M36 45 V55 M31 50 H41" stroke="#FBF3E7" stroke-width="0.8" opacity="0.35"/>
  <path d="M92 45 V55 M87 50 H97" stroke="#FBF3E7" stroke-width="0.8" opacity="0.35"/>
