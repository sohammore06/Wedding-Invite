  <!-- Headlight -->
  <circle cx="102" cy="40" r="3.2" fill="#F5E6A8"/>
  <circle cx="102" cy="40" r="1.6" fill="#E8C872"/>

  <!-- Floral garland on hood (marigold dots) -->
  <circle cx="88" cy="30" r="2.2" fill="#C9A24B"/>
  <circle cx="84" cy="28" r="1.8" fill="#7A2E3B"/>
  <circle cx="92" cy="29" r="1.6" fill="#5C6E51"/>
  <circle cx="86" cy="32" r="1.4" fill="#C9A24B"/>

  <!-- Tiny heart / monogram flag -->
